<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خياطتي - طلبات الخياطة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100">

<div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-lg">
    <!-- تسجيل الدخول -->
    <div id="login-screen" class="p-6">
        <h1 class="text-3xl font-bold text-center mb-8 text-indigo-700">خياطتي</h1>
        <div id="login-form">
            <h2 class="text-xl mb-4">دخول العملاء</h2>
            <input id="phone" type="tel" placeholder="+213799617966" class="w-full p-3 border rounded mb-3 text-left" dir="ltr">
            <button id="send-code" class="w-full bg-indigo-600 text-white p-3 rounded font-bold">أرسل كود SMS</button>
            <div id="recaptcha-container" class="mt-3"></div>
            <div id="code-div" class="hidden mt-4">
                <input id="code" type="text" placeholder="كود التحقق" class="w-full p-3 border rounded mb-3 text-center">
                <button id="verify-code" class="w-full bg-green-600 text-white p-3 rounded font-bold">تأكيد الدخول</button>
            </div>
        </div>
        <div class="mt-8 text-center border-t pt-4">
            <button id="tailor-login-btn" class="text-indigo-600">دخول الخياط</button>
        </div>
        <div id="tailor-form" class="hidden mt-4">
            <input id="tailor-email" type="email" placeholder="ايميل الخياط" class="w-full p-3 border rounded mb-3">
            <input id="tailor-pass" type="password" placeholder="كلمة السر" class="w-full p-3 border rounded mb-3">
            <button id="tailor-login" class="w-full bg-gray-800 text-white p-3 rounded font-bold">دخول</button>
        </div>
    </div>

    <!-- واجهة العميل -->
    <div id="client-screen" class="hidden p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">طلب جديد</h2>
            <button id="client-logout" class="text-red-500">خروج</button>
        </div>
        <textarea id="details" placeholder="اكتب تفاصيل الموديل والقياسات..." class="w-full p-3 border rounded mb-3 h-24"></textarea>
        
        <label class="block mb-2 font-bold">صورة الموديل:</label>
        <input id="image-input" type="file" accept="image/*" class="w-full p-2 border rounded mb-2">
        <div id="upload-status" class="text-sm mb-3"></div>
        <img id="preview" class="hidden w-full h-48 object-cover rounded mb-3">
        
        <input id="notes" type="text" placeholder="ملاحظات إضافية" class="w-full p-3 border rounded mb-3">
tailorEmail: 'milouddm10@gmail.com',
tailorPass: 'miloud.dm'
            <div id="btn-loader" class="loader hidden"></div>
        </button>
        
        <h3 class="text-xl font-bold mt-8 mb-3">طلباتي</h3>
        <div id="my-orders"></div>
    </div>

    <!-- واجهة الخياط -->
    <div id="tailor-screen" class="hidden p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">لوحة الطلبات</h2>
            <buton id="tailor-logout" class="text-red-500">خروج</button>
        </div>
        <div id="all-orders"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, collection, addDoc, query, where, onSnapshot, doc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // بيانات مشروعك جاهزة ✅
    const firebaseConfig = {
      apiKey: "AIzaSyAkNvk9ZTdMTm_FDHQfMY74DAglilexMHs",
      authDomain: "tailor-app-429a5.firebaseapp.com",
      projectId: "tailor-app-429a5",
      storageBucket: "tailor-app-429a5.firebasestorage.app",
      messagingSenderId: "71973806943",
      appId: "1:71973806943:web:fc8411f752943942a10cea",
      measurementId: "G-6Y3604GPE6"
    };

    // ⚠️ غيّر هذي السطرين بس ⚠️
    const CONFIG = {
        tailorEmail: 'غير-هذا@gmail.com', // حط ايميلك
        tailorPass: '12345678' // حط باسورد قوي
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginScreen = document.getElementById('login-screen');
    const clientScreen = document.getElementById('client-screen');
    const tailorScreen = document.getElementById('tailor-screen');
    let confirmationResult = null;
    let uploadedImageUrl = '';

    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {'size': 'invisible'});

    async function uploadToImgBB(file) {
        const formData = new FormData();
        formData.append('image', file);
        const API_KEY = '6d207e02198a847aa98d0a2a901485a5';
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, { method: 'POST', body: formData });
        const data = await response.json();
        if (data.success) return data.data.url;
        throw new Error('فشل رفع الصورة');
    }

    document.getElementById('image-input').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const status = document.getElementById('upload-status');
        status.textContent = 'جاري رفع الصورة...';
        status.className = 'text-sm mb-3 text-blue-600';
        try {
            uploadedImageUrl = await uploadToImgBB(file);
            document.getElementById('preview').src = uploadedImageUrl;
            document.getElementById('preview').classList.remove('hidden');
            status.textContent = '✅ تم رفع الصورة بنجاح';
            status.className = 'text-sm mb-3 text-green-600';
        } catch (err) {
            status.textContent = '❌ فشل الرفع: حاول مرة ثانية';
            status.className = 'text-sm mb-3 text-red-600';
            uploadedImageUrl = '';
        }
    };

    document.getElementById('send-code').onclick = async () => {
        const phone = document.getElementById('phone').value;
        try {
            confirmationResult = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
            document.getElementById('code-div').classList.remove('hidden');
            alert('تم ارسال الكود لـ ' + phone);
        } catch (e) { alert('خطأ: تأكد من الرقم +213... ' + e.message); }
    };

    document.getElementById('verify-code').onclick = async () => {
        const code = document.getElementById('code').value;
        try { await confirmationResult.confirm(code); } catch (e) { alert('كود خطأ'); }
    };

    document.getElementById('tailor-login-btn').onclick = () => document.getElementById('tailor-form').classList.toggle('hidden');

    document.getElementById('tailor-login').onclick = async () => {
        const email = document.getElementById('tailor-email').value;
        const pass = document.getElementById('tailor-pass').value;
        try { await signInWithEmailAndPassword(auth, email, pass); } catch (e) { alert('بيانات الخياط خطأ'); }
    };

    document.getElementById('submit-order').onclick = async () => {
        const details = document.getElementById('details').value;
        const notes = document.getElementById('notes').value;
        const btnText = document.getElementById('btn-text');
        const btnLoader = document.getElementById('btn-loader');
        if (!details) return alert('اكتب تفاصيل الموديل');
        if (!uploadedImageUrl) return alert('لازم ترفع صورة الموديل');
        btnText.classList.add('hidden'); btnLoader.classList.remove('hidden');
        try {
            await addDoc(collection(db, 'orders'), {
                userId: auth.currentUser.uid, phone: auth.currentUser.phoneNumber,
                details, notes, imageUrl: uploadedImageUrl, status: 'جديد', createdAt: serverTimestamp()
            });
            alert('تم ارسال طلبك بنجاح ✅');
            document.getElementById('details').value = ''; document.getElementById('notes').value = '';
            document.getElementById('image-input').value = ''; document.getElementById('preview').classList.add('hidden');
            document.getElementById('upload-status').textContent = ''; uploadedImageUrl = '';
        } catch (e) { alert('خطأ: ' + e.message);
        } finally { btnText.classList.remove('hidden'); btnLoader.classList.add('hidden'); }
    };

    const showOrders = (orders, div, isTailor) => {
        div.innerHTML = '';
        if(orders.length === 0) div.innerHTML = '<p class="text-gray-500 text-center">لا توجد طلبات</p>';
        orders.forEach(order => {
            const d = order.data();
            div.innerHTML += `
                <div class="border p-4 rounded mb-3 bg-gray-50">
                    <p class="mb-2"><b>الحالة:</b> <span class="px-2 py-1 rounded text-sm ${d.status === 'جديد' ? 'bg-blue-100' : d.status === 'قيد التنفيذ' ? 'bg-yellow-100' : 'bg-green-100'}">${d.status}</span></p>
                    ${d.imageUrl ? `<img src="${d.imageUrl}" class="w-full h-48 object-cover rounded mb-2">` : ''}
                    <p><b>التفاصيل:</b> ${d.details}</p>
                    <p><b>ملاحظات:</b> ${d.notes || 'لا يوجد'}</p>
                    ${isTailor ? `<p class="mt-2"><b>جوال العميل:</b> ${d.phone}</p>
                    <select onchange="updateStatus('${order.id}', this.value)" class="mt-2 p-2 border rounded w-full">
                        <option ${d.status === 'جديد' ? 'selected' : ''}>جديد</option>
                        <option ${d.status === 'قيد التنفيذ' ? 'selected' : ''}>قيد التنفيذ</option>
                        <option ${d.status === 'جاهز' ? 'selected' : ''}>جاهز</option>
                    </select>` : ''}
                </div>`;
        });
    };

    window.updateStatus = async (id, status) => { await updateDoc(doc(db, 'orders', id), { status }); };

    onAuthStateChanged(auth, user => {
        if (user) {
            loginScreen.classList.add('hidden');
            if (user.email === CONFIG.tailorEmail) {
                tailorScreen.classList.remove('hidden');
                onSnapshot(collection(db, 'orders'), snap => showOrders(snap.docs, document.getElementById('all-orders'), true));
            } else {
                clientScreen.classList.remove('hidden');
                const q = query(collection(db, 'orders'), where('userId', '==', user.uid));
                onSnapshot(q, snap => showOrders(snap.docs, document.getElementById('my-orders'), false));
            }
        } else {
            loginScreen.classList.remove('hidden'); clientScreen.classList.add('hidden'); tailorScreen.classList.add('hidden');
        }
    });

    document.getElementById('client-logout').onclick = () => signOut(auth);
    document.getElementById('tailor-logout').onclick = () => signOut(auth);
</script>
</body>
</html>
