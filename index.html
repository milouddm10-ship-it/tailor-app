<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخياطين - MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
       .hidden { display: none!important; }
       .tab-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; }
        input[type="file"] { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="app" class="min-h-screen pb-20"></div>

<script>
const state = {
    userType: 'client',
    orders: JSON.parse(localStorage.getItem('tailorOrders') || '[]'),
    measurements: JSON.parse(localStorage.getItem('measurements') || '{}'),
    currentOrderId: null
};

function saveState() {
    localStorage.setItem('tailorOrders', JSON.stringify(state.orders));
    localStorage.setItem('measurements', JSON.stringify(state.measurements));
}

function render() {
    const app = document.getElementById('app');
    app.innerHTML = `
        <div class="bg-white shadow-sm sticky top-0 z-50">
            <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                <h1 class="text-xl font-bold text-blue-600">منصة الخياطين</h1>
                <div class="flex gap-2 bg-gray-100 rounded-lg p-1">
                    <button onclick="switchUser('client')" class="px-4 py-2 rounded-md text-sm ${state.userType === 'client'? 'bg-white shadow' : ''}">عميل</button>
                    <button onclick="switchUser('tailor')" class="px-4 py-2 rounded-md text-sm ${state.userType === 'tailor'? 'bg-white shadow' : ''}">خياط</button>
                </div>
            </div>
        </div>
        <div class="max-w-4xl mx-auto p-4">
            ${state.userType === 'client'? renderClient() : renderTailor()}
        </div>
    `;
}

function switchUser(type) {
    state.userType = type;
    render();
}

function renderClient() {
    return `
        <div class="bg-white rounded-xl shadow-sm mb-4">
            <div class="flex border-b">
                <button onclick="showTab('orders')" id="tab-orders" class="flex-1 py-3 text-center tab-active">طلباتي</button>
                <button onclick="showTab('new')" id="tab-new" class="flex-1 py-3 text-center">طلب جديد</button>
                <button onclick="showTab('measure')" id="tab-measure" class="flex-1 py-3 text-center">قياساتي</button>
            </div>
        </div>
        <div id="content-orders" class="tab-content">${renderClientOrders()}</div>
        <div id="content-new" class="tab-content hidden">${renderNewOrder()}</div>
        <div id="content-measure" class="tab-content hidden">${renderMeasurements()}</div>
    `;
}

function renderClientOrders() {
    if (state.orders.length === 0) {
        return `<div class="bg-white rounded-xl p-8 text-center text-gray-500">لا توجد طلبات حالياً. أنشئ طلبك الأول</div>`;
    }
    return state.orders.map(order => `
        <div class="bg-white rounded-xl shadow-sm p-4 mb-3">
            <div class="flex justify-between items-start mb-3">
                <div>
                    <h3 class="font-bold">طلب #${order.id}</h3>
                    <p class="text-sm text-gray-500">${order.date}</p>
                </div>
                <span class="px-3 py-1 rounded-full text-xs ${getStatusColor(order.status)}">${order.status}</span>
            </div>
            ${order.price? `<p class="text-sm mb-2">السعر: <span class="font-bold">${order.price} ريال</span></p>` : ''}
            ${order.deliveryDate? `<p class="text-sm mb-2">موعد التسليم: ${order.deliveryDate}</p>` : ''}
            <button onclick="viewOrder(${order.id})" class="text-blue-600 text-sm font-medium">عرض التفاصيل والشات ←</button>
        </div>
    `).join('');
}

function renderNewOrder() {
    return `
        <div class="bg-white rounded-xl shadow-sm p-4">
            <h2 class="font-bold text-lg mb-4">طلب جديد</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">ملاحظات القماش والتصميم</label>
                    <textarea id="orderNotes" class="w-full border rounded-lg p-3" rows="3" placeholder="مثال: أبي ثوب أبيض كلاسيك، قماش صيفي بارد..."></textarea>
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-2">صور الجسم - اختياري</label>
                    <div onclick="document.getElementById('bodyImages').click()" class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center cursor-pointer hover:bg-gray-50">
                        <p class="text-gray-500">اضغط لاختيار صور</p>
                        <p class="text-xs text-gray-400 mt-1">PNG, JPG حتى 5MB</p>
                    </div>
                    <input type="file" id="bodyImages" accept="image/*" multiple onchange="handleImageUpload(event, 'body')">
                    <div id="bodyPreview" class="flex gap-2 mt-3 flex-wrap"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">صور مرجعية للموديل</label>
                    <div onclick="document.getElementById('refImages').click()" class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center cursor-pointer hover:bg-gray-50">
                        <p class="text-gray-500">اضغط لاختيار صور</p>
                    </div>
                    <input type="file" id="refImages" accept="image/*" multiple onchange="handleImageUpload(event, 'ref')">
                    <div id="refPreview" class="flex gap-2 mt-3 flex-wrap"></div>
                </div>

                <button onclick="submitOrder()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">إرسال الطلب</button>
            </div>
        </div>
    `;
}

function renderMeasurements() {
    const m = state.measurements;
    return `
        <div class="bg-white rounded-xl shadow-sm p-4">
            <h2 class="font-bold text-lg mb-4">قياساتي</h2>
            <div class="grid grid-cols-2 gap-3">
                ${['الطول', 'الكتف', 'الصدر', 'الخصر', 'الأرداف', 'طول الكم', 'محيط الرقبة', 'طول الثوب'].map(field => `
                    <div>
                        <label class="block text-sm mb-1">${field}</label>
                        <input type="number" id="m-${field}" value="${m[field] || ''}" class="w-full border rounded-lg p-2" placeholder="سم">
                    </div>
                `).join('')}
            </div>
            <button onclick="saveMeasurements()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold mt-4">حفظ القياسات</button>
        </div>
    `;
}

function handleImageUpload(event, type) {
    const files = event.target.files;
    const container = document.getElementById(type + 'Preview');
    
    for (let file of files) {
        if (file.size > 5 * 1024 * 1024) {
            alert('حجم الصورة كبير جداً. الحد الأقصى 5MB');
            continue;
        }
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const imgDiv = document.createElement('div');
            imgDiv.className = 'relative';
            imgDiv.dataset.base64 = e.target.result;
            imgDiv.innerHTML = `
                <img src="${e.target.result}" class="w-20 h-20 object-cover rounded-lg">
                <button onclick="this.parentElement.remove()" class="absolute -top-2 -left-2 bg-red-500 text-white rounded-full w-6 h-6 text-xs">×</button>
            `;
            container.appendChild(imgDiv);
        };
        reader.readAsDataURL(file);
    }
    event.target.value = '';
}

function saveMeasurements() {
    const fields = ['الطول', 'الكتف', 'الصدر', 'الخصر', 'الأرداف', 'طول الكم', 'محيط الرقبة', 'طول الثوب'];
    fields.forEach(field => {
        state.measurements[field] = document.getElementById('m-' + field).value;
    });
    saveState();
    alert('تم حفظ القياسات بنجاح');
}

function submitOrder() {
    const bodyImgs = Array.from(document.querySelectorAll('#bodyPreview [data-base64]')).map(d => d.dataset.base64);
    const refImgs = Array.from(document.querySelectorAll('#refPreview [data-base64]')).map(d => d.dataset.base64);
    const notes = document.getElementById('orderNotes').value;
    
    if (!notes && refImgs.length === 0) {
        alert('اكتب ملاحظات أو ارفع صورة مرجعية على الأقل');
        return;
    }
    
    const order = {
        id: Date.now(),
        date: new Date().toLocaleDateString('ar-SA'),
        status: 'جديد',
        notes: notes,
        measurements: {...state.measurements},
        bodyImages: bodyImgs,
        refImages: refImgs,
        chat: []
    };
    
    state.orders.unshift(order);
    saveState();
    alert('تم إرسال طلبك بنجاح');
    showTab('orders');
    render();
}

function renderTailor() {
    return `
        <div class="bg-white rounded-xl shadow-sm p-4 mb-4">
            <h2 class="font-bold text-lg">طلبات العملاء</h2>
            <p class="text-sm text-gray-500">إجمالي: ${state.orders.length} طلب</p>
        </div>
        ${state.orders.length === 0? 
            `<div class="bg-white rounded-xl p-8 text-center text-gray-500">لا توجد طلبات جديدة</div>` :
            state.orders.map(order => `
                <div class="bg-white rounded-xl shadow-sm p-4 mb-3">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="font-bold">طلب #${order.id}</h3>
                            <p class="text-sm text-gray-500">${order.date}</p>
                        </div>
                        <span class="px-3 py-1 rounded-full text-xs ${getStatusColor(order.status)}">${order.status}</span>
                    </div>
                    <p class="text-sm text-gray-600 mb-3">${order.notes || 'لا توجد ملاحظات'}</p>
                    <div class="flex gap-2">
                        <button onclick="viewOrder(${order.id})" class="flex-1 bg-blue-600 text-white py-2 rounded-lg text-sm">عرض التفاصيل</button>
                        ${order.status === 'جديد'? `<button onclick="acceptOrder(${order.id})" class="flex-1 bg-green-600 text-white py-2 rounded-lg text-sm">قبول الطلب</button>` : ''}
                    </div>
                </div>
            `).join('')
        }
    `;
}

function viewOrder(id) {
    const order = state.orders.find(o => o.id === id);
    state.currentOrderId = id;
    const app = document.getElementById('app');
    app.innerHTML = `
        <div class="bg-white shadow-sm sticky top-0 z-50">
            <div class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-3">
                <button onclick="render()" class="text-2xl">→</button>
                <h1 class="text-lg font-bold">طلب #${order.id}</h1>
            </div>
        </div>
        <div class="max-w-4xl mx-auto p-4 space-y-4">
            <div class="bg-white rounded-xl shadow-sm p-4">
                <h3 class="font-bold mb-3">الحالة</h3>
                <span class="px-3 py-1 rounded-full text-sm ${getStatusColor(order.status)}">${order.status}</span>
                ${state.userType === 'tailor' && order.status!== 'مكتمل'? `
                    <div class="mt-4 flex gap-2">
                        <select id="statusUpdate" class="flex-1 border rounded-lg p-2">
                            <option>قيد المراجعة</option>
                            <option>قيد التنفيذ</option>
                            <option>جاهز للاستلام</option>
                            <option>مكتمل</option>
                        </select>
                        <button onclick="updateStatus(${order.id})" class="bg-blue-600 text-white px-4 rounded-lg">تحديث</button>
                    </div>
                ` : ''}
            </div>

            ${state.userType === 'tailor' && order.status === 'جديد'? `
                <div class="bg-white rounded-xl shadow-sm p-4">
                    <h3 class="font-bold mb-3">تحديد السعر والموعد</h3>
                    <input type="number" id="price" placeholder="السعر بالريال" class="w-full border rounded-lg p-3 mb-2">
                    <input type="date" id="deliveryDate" class="w-full border rounded-lg p-3 mb-3">
                    <button onclick="confirmOrder(${order.id})" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold">تأكيد الطلب</button>
                </div>
            ` : ''}

            ${order.price? `
                <div class="bg-white rounded-xl shadow-sm p-4">
                    <p><span class="text-gray-500">السعر:</span> <span class="font-bold">${order.price} ريال</span></p>
                    ${order.deliveryDate? `<p><span class="text-gray-500">التسليم:</span> ${order.deliveryDate}</p>` : ''}
                </div>
            ` : ''}

            <div class="bg-white rounded-xl shadow-sm p-4">
                <h3 class="font-bold mb-3">القياسات</h3>
                <div class="grid grid-cols-2 gap-2 text-sm">
                    ${Object.entries(order.measurements).map(([k,v]) => v? `<div><span class="text-gray-500">${k}:</span> ${v} سم</div>` : '').join('')}
                </div>
            </div>

            ${order.bodyImages.length > 0? `
                <div class="bg-white rounded-xl shadow-sm p-4">
                    <h3 class="font-bold mb-3">صور الجسم</h3>
                    <div class="flex gap-2 flex-wrap">
                        ${order.bodyImages.map(img => `<img src="${img}" class="w-24 h-24 object-cover rounded-lg">`).join('')}
                    </div>
                </div>
            ` : ''}

            ${order.refImages.length > 0? `
                <div class="bg-white rounded-xl shadow-sm p-4">
                    <h3 class="font-bold mb-3">صور مرجعية</h3>
                    <div class="flex gap-2 flex-wrap">
                        ${order.refImages.map(img => `<img src="${img}" class="w-24 h-24 object-cover rounded-lg">`).join('')}
                    </div>
                </div>
            ` : ''}

            <div class="bg-white rounded-xl shadow-sm p-4">
                <h3 class="font-bold mb-3">المحادثة</h3>
                <div id="chatBox" class="space-y-2 mb-3 max-h-60 overflow-y-auto">
                    ${order.chat.map(msg => `
                        <div class="flex ${msg.sender === state.userType? 'justify-end' : 'justify-start'}">
                            <div class="max-w-[70%] px-3 py-2 rounded-lg ${msg.sender === state.userType? 'bg-blue-600 text-white' : 'bg-gray-100'}">
                                ${msg.text}
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div class="flex gap-2">
                    <input id="chatInput" type="text" placeholder="اكتب رسالة..." class="flex-1 border rounded-lg p-2" onkeypress="if(event.key==='Enter') sendMessage(${order.id})">
                    <button onclick="sendMessage(${order.id})" class="bg-blue-600 text-white px-4 rounded-lg">إرسال</button>
                </div>
            </div>
        </div>
    `;
}

function acceptOrder(id) {
    const order = state.orders.find(o => o.id === id);
    order.status = 'قيد المراجعة';
    saveState();
    viewOrder(id);
}

function confirmOrder(id) {
    const order = state.orders.find(o => o.id === id);
    order.price = document.getElementById('price').value;
    order.deliveryDate = document.getElementById('deliveryDate').value;
    order.status = 'قيد التنفيذ';
    saveState();
    alert('تم تأكيد الطلب');
    viewOrder(id);
}

function updateStatus(id) {
    const order = state.orders.find(o => o.id === id);
    order.status = document.getElementById('statusUpdate').value;
    saveState();
    viewOrder(id);
}

function sendMessage(id) {
    const order = state.orders.find(o => o.id === id);
    const input = document.getElementById('chatInput');
    if (!input.value.trim()) return;
    order.chat.push({sender: state.userType, text: input.value, time: Date.now()});
    saveState();
    viewOrder(id);
}

function showTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('[id^=tab-]').forEach(el => el.classList.remove('tab-active'));
    document.getElementById('content-' + tab).classList.remove('hidden');
    document.getElementById('tab-' + tab).classList.add('tab-active');
}

function getStatusColor(status) {
    const colors = {
        'جديد': 'bg-blue-100 text-blue-700',
        'قيد المراجعة': 'bg-yellow-100 text-yellow-700',
        'قيد التنفيذ': 'bg-purple-100 text-purple-700',
        'جاهز للاستلام': 'bg-green-100 text-green-700',
        'مكتمل': 'bg-gray-100 text-gray-700'
    };
    return colors[status] || 'bg-gray-100 text-gray-700';
}

render();
</script>
</body>
</html>
